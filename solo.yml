name: Runner Dashboard
icon: src-tauri/icons/128x128.png
processes:
  Dev app:
    command: pnpm tauri dev
    auto_start: false
  Build app:
    command: pnpm tauri build
    auto_start: false
  Install app to /Applications:
    command: sh scripts/install-app.sh
    auto_start: false
  Fleet parity (read-only):
    command: scripts/fleet-parity.sh
    auto_start: false
  Tests:
    command: cargo fmt --all --check && cargo test --workspace && cargo clippy --workspace --all-targets -- -D warnings && pnpm typecheck && pnpm test
    auto_start: false
  Browser preview:
    command: pnpm dev
    auto_start: false
  # Empties the real build directory. A plain `cargo clean` only removes a `target` symlink
  # and leaves what it points at, so this resolves the link and puts the directory back.
  Clear Rust build artifacts:
    command: t=$(cd target && pwd -P) && CARGO_TARGET_DIR="$t" cargo clean && mkdir -p "$t"
    auto_start: false
